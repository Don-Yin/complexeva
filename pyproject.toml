[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "complexeva"
version = "0.5.0"
description = "Fast, low-memory complexity measures for time series (EEG, MEG, physiology), single signals or batches"
keywords = ["complexity", "entropy", "fractal dimension", "EEG", "time series", "Lempel-Ziv", "DFA"]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Don Yin", email = "don_yin@outlook.com" }]
requires-python = ">=3.14"
dependencies = ["numpy", "scipy", "numba"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
test = ["pytest"]
docs = ["sphinx", "furo", "myst-parser", "sphinx-gallery", "mne", "matplotlib"]

[project.urls]
Homepage = "https://github.com/Don-Yin/complexeva"
Documentation = "https://don-yin.github.io/complexeva/"
Changelog = "https://github.com/Don-Yin/complexeva/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.sdist]
include = ["/complexeva", "/tests", "/README.md", "/CHANGELOG.md", "/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 128
